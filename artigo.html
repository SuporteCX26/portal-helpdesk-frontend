<script>
    function parseMarkdown(text) {
      if (!text || typeof text !== 'string') return '';
      return text.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const articleId = urlParams.get('id') || 'configuracoes-identidade';

      try {
        const response = await fetch('artigos.json');
        if (!response.ok) throw new Error('Não foi possível carregar o arquivo artigos.json');
        
        const artigos = await response.json();
        const artigo = artigos[articleId];

        if (!artigo) {
          document.getElementById('article-title').innerText = 'Artigo não encontrado';
          document.getElementById('article-category-breadcrumb').innerText = 'Erro';
          return;
        }

        // Renderiza Dados Básicos
        document.title = `${artigo.titulo} | iTicket Help`;
        document.getElementById('article-category-breadcrumb').innerText = artigo.categoria || '';
        document.getElementById('article-badge').innerText = artigo.categoria || '';
        document.getElementById('article-time').querySelector('span:last-child').innerText = artigo.tempoLeitura || '';
        document.getElementById('article-date').innerText = artigo.atualizadoEm ? `• Atualizado em ${artigo.atualizadoEm}` : '';
        document.getElementById('article-title').innerText = artigo.titulo || '';
        document.getElementById('article-desc').innerHTML = parseMarkdown(artigo.descricao);

        // Vídeo Principal Embed
        if (artigo.videoUrl && artigo.videoUrl.trim() !== '') {
          document.getElementById('video-container').classList.remove('hidden');
          document.getElementById('article-video').src = artigo.videoUrl;
        }

        // Pré-requisitos
        if (artigo.prerequisitos && artigo.prerequisitos.length > 0) {
          const prereqContainer = document.getElementById('prereq-container');
          const prereqList = document.getElementById('prereq-list');
          prereqContainer.classList.remove('hidden');
          prereqList.innerHTML = '';
          artigo.prerequisitos.forEach(req => {
            const li = document.createElement('li');
            li.innerHTML = parseMarkdown(req);
            prereqList.appendChild(li);
          });
        }

        // Renderiza Passos Numerados + GIFs/Imagens
        const stepsContainer = document.getElementById('steps-container');
        stepsContainer.innerHTML = '';
        if (artigo.passos && artigo.passos.length > 0) {
          artigo.passos.forEach(passo => {
            const div = document.createElement('div');
            div.className = 'bg-surface-container-low p-md rounded-xl space-y-sm';

            let imgElement = '';
            if (passo.imagem && passo.imagem.trim() !== '') {
              imgElement = `
                <div class="mt-sm rounded-xl overflow-hidden border border-surface-container-high shadow-sm max-w-3xl">
                  <img src="${passo.imagem}" alt="${passo.titulo}" class="w-full h-auto object-cover rounded-xl" loading="lazy">
                </div>
              `;
            }

            div.innerHTML = `
              <div class="flex items-start gap-sm">
                <span class="w-8 h-8 rounded-full bg-secondary-fixed text-on-secondary-fixed font-headline-md text-base flex items-center justify-center shrink-0 mt-0.5">${passo.numero}</span>
                <div class="flex-1">
                  <h4 class="font-headline-md text-headline-md text-on-surface mb-base">${passo.titulo}</h4>
                  <div class="font-body-md text-on-surface-variant leading-relaxed">${parseMarkdown(passo.descricao)}</div>
                  ${imgElement}
                </div>
              </div>
            `;
            stepsContainer.appendChild(div);
          });
        }

        // Dica de Ouro
        if (artigo.dicaOuro && artigo.dicaOuro.trim() !== '') {
          document.getElementById('dica-container').classList.remove('hidden');
          document.getElementById('dica-text').innerHTML = parseMarkdown(artigo.dicaOuro);
        }

        // Caixa de Alerta
        if (artigo.alerta && artigo.alerta.trim() !== '') {
          document.getElementById('alerta-container').classList.remove('hidden');
          document.getElementById('alerta-text').innerHTML = parseMarkdown(artigo.alerta);
        }

        // Artigos Relacionados
        const relGrid = document.getElementById('relacionados-grid');
        relGrid.innerHTML = '';
        if (artigo.relacionados && artigo.relacionados.length > 0) {
          artigo.relacionados.forEach(rel => {
            const a = document.createElement('a');
            a.href = `artigo.html?id=${rel.id}`;
            a.className = 'p-md bg-surface-container-lowest rounded-xl border border-surface-container-high hover:shadow-md transition-all flex items-center justify-between group';
            a.innerHTML = `
              <span class="font-label-md text-on-surface group-hover:text-primary transition-colors">${rel.titulo}</span>
              <span class="material-symbols-outlined text-secondary group-hover:translate-x-1 transition-transform">arrow_forward</span>
            `;
            relGrid.appendChild(a);
          });
        }

      } catch (err) {
        console.error('Erro ao carregar o artigo:', err);
        document.getElementById('article-title').innerText = 'Erro ao carregar conteúdo';
        document.getElementById('article-desc').innerText = 'Verifique a formatação do arquivo artigos.json no GitHub.';
      }
    });

    function handleFeedback(isPositive) {
      document.getElementById('feedback-actions').classList.add('hidden');
      document.getElementById('feedback-thanks').classList.remove('hidden');
    }
  </script>
